<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" role="img" aria-label="Three numbered cue cards fanned out on a drafting table, each with a few keywords, next to a lectern with a microphone. A chip reads: 4 to 5 minutes, CAPS 10 marks, IEB 20 marks."><rect width="680" height="300" fill="#f6f4ee"/><path d="M520 280l20-120h100l20 120z" fill="#e5e8f4" stroke="#2747d6" stroke-width="2"/><rect x="530" y="150" width="120" height="14" rx="3" fill="#2747d6"/><path d="M588 150c0-30 10-50 30-60" stroke="#16181d" stroke-width="3" fill="none"/><rect x="612" y="74" width="16" height="26" rx="8" fill="#16181d" transform="rotate(30 620 87)"/><g transform="rotate(-6 99 130)"><rect x="24" y="80" width="150" height="100" rx="6" fill="#ffffff" stroke="#d7dcf3" stroke-width="1.5"/><circle cx="42" cy="98" r="10" fill="#2747d6"/><text x="42" y="102.5" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace" font-size="12" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle">1</text><text x="60" y="104" font-family="'Instrument Sans', 'Inter Tight', Arial, sans-serif" font-size="12.5" font-weight="600" font-style="normal" fill="#16181d" text-anchor="start">HOOK: two</text><text x="60" y="126" font-family="'Instrument Sans', 'Inter Tight', Arial, sans-serif" font-size="12.5" font-weight="600" font-style="normal" fill="#16181d" text-anchor="start">hours - gone?</text><text x="60" y="148" font-family="'Instrument Sans', 'Inter Tight', Arial, sans-serif" font-size="12.5" font-weight="600" font-style="normal" fill="#16181d" text-anchor="start">PAUSE</text></g><g transform="rotate(-1 259 146)"><rect x="184" y="96" width="150" height="100" rx="6" fill="#ffffff" stroke="#d7dcf3" stroke-width="1.5"/><circle cx="202" cy="114" r="10" fill="#2747d6"/><text x="202" y="118.5" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace" font-size="12" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle">2</text><text x="220" y="120" font-family="'Instrument Sans', 'Inter Tight', Arial, sans-serif" font-size="12.5" font-weight="600" font-style="normal" fill="#16181d" text-anchor="start">Point 1:</text><text x="220" y="142" font-family="'Instrument Sans', 'Inter Tight', Arial, sans-serif" font-size="12.5" font-weight="600" font-style="normal" fill="#16181d" text-anchor="start">the red dot</text><text x="220" y="164" font-family="'Instrument Sans', 'Inter Tight', Arial, sans-serif" font-size="12.5" font-weight="600" font-style="normal" fill="#16181d" text-anchor="start">look up</text></g><g transform="rotate(4 419 162)"><rect x="344" y="112" width="150" height="100" rx="6" fill="#ffffff" stroke="#d7dcf3" stroke-width="1.5"/><circle cx="362" cy="130" r="10" fill="#2747d6"/><text x="362" y="134.5" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace" font-size="12" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle">3</text><text x="380" y="136" font-family="'Instrument Sans', 'Inter Tight', Arial, sans-serif" font-size="12.5" font-weight="600" font-style="normal" fill="#16181d" text-anchor="start">Point 2:</text><text x="380" y="158" font-family="'Instrument Sans', 'Inter Tight', Arial, sans-serif" font-size="12.5" font-weight="600" font-style="normal" fill="#16181d" text-anchor="start">no-scroll day</text><text x="380" y="180" font-family="'Instrument Sans', 'Inter Tight', Arial, sans-serif" font-size="12.5" font-weight="600" font-style="normal" fill="#16181d" text-anchor="start">"Ninety."</text></g><rect x="420" y="252" width="240" height="24" rx="12" fill="#2747d6"/><text x="540.0" y="268.5" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace" font-size="11.5" font-weight="600" font-style="normal" fill="#ffffff" text-anchor="middle">4-5 min  ·  CAPS 10  ·  IEB 20</text><text x="40" y="40" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" font-size="22" font-weight="400" font-style="italic" fill="#16181d" text-anchor="start">The prepared speech</text></svg>
