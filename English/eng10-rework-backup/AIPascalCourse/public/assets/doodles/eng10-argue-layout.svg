<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" role="img" aria-label="The plan of an argumentative essay drawn as a layout: introduction with the thesis, three body paragraphs built Point, Evidence, Explain, Link, a rebuttal and a conclusion, with rough word counts. A red line shows the thesis running through every paragraph."><defs><pattern id="eng10-argue-layout-grid" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M16 0V16M0 16H16" fill="none" stroke="#2747d6" stroke-opacity=".07" stroke-width="1"/></pattern></defs><rect width="680" height="440" fill="#f6f4ee"/><rect x="20" y="20" width="640" height="400" rx="6" fill="#ffffff"/><rect x="20" y="20" width="640" height="400" fill="url(#eng10-argue-layout-grid)"/><rect x="20" y="20" width="640" height="400" rx="6" fill="none" stroke="#d7dcf3" stroke-width="1.5"/><rect x="40" y="40" width="128" height="44" rx="4" fill="#2747d6"/><text x="104" y="67" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle">INTRODUCTION</text><rect x="176" y="40" width="380" height="44" rx="4" fill="#f2f4fc" stroke="#d7dcf3" stroke-width="1.2"/><text x="188" y="67" font-family="'Instrument Sans', 'Inter Tight', Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#16181d" text-anchor="start">hook  ·  the issue  ·  your stance in one sentence (the thesis)</text><text x="566" y="67" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace" font-size="12" font-weight="600" font-style="normal" fill="#2747d6" text-anchor="start">~50 words</text><rect x="40" y="100" width="128" height="44" rx="4" fill="#2747d6"/><text x="104" y="127" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle">BODY 1</text><rect x="176" y="100" width="380" height="44" rx="4" fill="#f2f4fc" stroke="#d7dcf3" stroke-width="1.2"/><text x="188" y="127" font-family="'Instrument Sans', 'Inter Tight', Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#16181d" text-anchor="start">P point  ·  E evidence  ·  E explain  ·  L link back to the thesis</text><text x="566" y="127" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace" font-size="12" font-weight="600" font-style="normal" fill="#2747d6" text-anchor="start">~70 words</text><rect x="40" y="160" width="128" height="44" rx="4" fill="#2747d6"/><text x="104" y="187" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle">BODY 2</text><rect x="176" y="160" width="380" height="44" rx="4" fill="#f2f4fc" stroke="#d7dcf3" stroke-width="1.2"/><text x="188" y="187" font-family="'Instrument Sans', 'Inter Tight', Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#16181d" text-anchor="start">a second reason - a different one, not the first in new words</text><text x="566" y="187" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace" font-size="12" font-weight="600" font-style="normal" fill="#2747d6" text-anchor="start">~70 words</text><rect x="40" y="220" width="128" height="44" rx="4" fill="#2747d6"/><text x="104" y="247" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle">BODY 3</text><rect x="176" y="220" width="380" height="44" rx="4" fill="#f2f4fc" stroke="#d7dcf3" stroke-width="1.2"/><text x="188" y="247" font-family="'Instrument Sans', 'Inter Tight', Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#16181d" text-anchor="start">your strongest reason, saved for last</text><text x="566" y="247" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace" font-size="12" font-weight="600" font-style="normal" fill="#2747d6" text-anchor="start">~70 words</text><rect x="40" y="280" width="128" height="44" rx="4" fill="#2747d6"/><text x="104" y="307" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle">REBUTTAL</text><rect x="176" y="280" width="380" height="44" rx="4" fill="#f2f4fc" stroke="#d7dcf3" stroke-width="1.2"/><text x="188" y="307" font-family="'Instrument Sans', 'Inter Tight', Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#16181d" text-anchor="start">the other side's best point  ·  why it does not change your mind</text><text x="566" y="307" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace" font-size="12" font-weight="600" font-style="normal" fill="#2747d6" text-anchor="start">~50 words</text><rect x="40" y="340" width="128" height="44" rx="4" fill="#2747d6"/><text x="104" y="367" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle">CONCLUSION</text><rect x="176" y="340" width="380" height="44" rx="4" fill="#f2f4fc" stroke="#d7dcf3" stroke-width="1.2"/><text x="188" y="367" font-family="'Instrument Sans', 'Inter Tight', Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#16181d" text-anchor="start">stance again in new words  ·  a strong last line  ·  no new points</text><text x="566" y="367" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace" font-size="12" font-weight="600" font-style="normal" fill="#2747d6" text-anchor="start">~40 words</text><path d="M176 89c-40 60-40 210 0 270" stroke="#ff4b2b" stroke-width="2.5" fill="none"/><text x="34" y="412" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace" font-size="12" font-weight="700" font-style="normal" fill="#ff4b2b" text-anchor="start">the thesis runs through every paragraph</text><rect x="420" y="392" width="226" height="24" rx="12" fill="#2747d6"/><text x="533.0" y="408.5" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace" font-size="11.5" font-weight="600" font-style="normal" fill="#ffffff" text-anchor="middle">CAPS 300-350  ·  IEB 400-500</text></svg>
