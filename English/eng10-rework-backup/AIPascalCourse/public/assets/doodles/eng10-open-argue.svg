<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" role="img" aria-label="A drafting table: three stacked drafts with tabs v1, v2 and v3. The top draft shows the essay as blocks: intro and stance, three reasons, a rebuttal and a conclusion, with a red caret adding the word because. A chip gives the lengths: CAPS 300 to 350 words, IEB 400 to 500."><defs><pattern id="eng10-open-argue-grid" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M16 0V16M0 16H16" fill="none" stroke="#2747d6" stroke-opacity=".07" stroke-width="1"/></pattern></defs><rect width="680" height="300" fill="#f6f4ee"/><rect x="80" y="34" width="34" height="18" rx="4" fill="#2747d6"/><text x="97" y="47" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace" font-size="11" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle">v1</text><rect x="70" y="50" width="300" height="200" rx="6" fill="#ffffff"/><rect x="70" y="50" width="300" height="200" fill="url(#eng10-open-argue-grid)"/><rect x="70" y="50" width="300" height="200" rx="6" fill="none" stroke="#d7dcf3" stroke-width="1.5"/><rect x="130" y="50" width="34" height="18" rx="4" fill="#2747d6"/><text x="147" y="63" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace" font-size="11" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle">v2</text><rect x="55" y="66" width="300" height="200" rx="6" fill="#ffffff"/><rect x="55" y="66" width="300" height="200" fill="url(#eng10-open-argue-grid)"/><rect x="55" y="66" width="300" height="200" rx="6" fill="none" stroke="#d7dcf3" stroke-width="1.5"/><rect x="180" y="66" width="34" height="18" rx="4" fill="#2747d6"/><text x="197" y="79" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace" font-size="11" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle">v3</text><rect x="40" y="82" width="300" height="196" rx="6" fill="#ffffff"/><rect x="40" y="82" width="300" height="196" fill="url(#eng10-open-argue-grid)"/><rect x="40" y="82" width="300" height="196" rx="6" fill="none" stroke="#d7dcf3" stroke-width="1.5"/><rect x="60" y="100" width="200" height="22" rx="3" fill="#f2f4fc" stroke="#2747d6" stroke-width="1.3"/><text x="70" y="115" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace" font-size="11" font-weight="600" font-style="normal" fill="#2747d6" text-anchor="start">INTRO + STANCE</text><rect x="60" y="130" width="200" height="22" rx="3" fill="#f2f4fc" stroke="#2747d6" stroke-width="1.3"/><text x="70" y="145" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace" font-size="11" font-weight="600" font-style="normal" fill="#2747d6" text-anchor="start">REASON 1</text><rect x="60" y="160" width="200" height="22" rx="3" fill="#f2f4fc" stroke="#2747d6" stroke-width="1.3"/><text x="70" y="175" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace" font-size="11" font-weight="600" font-style="normal" fill="#2747d6" text-anchor="start">REASON 2</text><rect x="60" y="190" width="200" height="22" rx="3" fill="#f2f4fc" stroke="#2747d6" stroke-width="1.3"/><text x="70" y="205" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace" font-size="11" font-weight="600" font-style="normal" fill="#2747d6" text-anchor="start">REASON 3</text><rect x="60" y="220" width="200" height="22" rx="3" fill="#f2f4fc" stroke="#2747d6" stroke-width="1.3"/><text x="70" y="235" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace" font-size="11" font-weight="600" font-style="normal" fill="#2747d6" text-anchor="start">REBUTTAL</text><rect x="60" y="250" width="200" height="22" rx="3" fill="#f2f4fc" stroke="#2747d6" stroke-width="1.3"/><text x="70" y="265" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace" font-size="11" font-weight="600" font-style="normal" fill="#2747d6" text-anchor="start">CONCLUSION</text><path d="M272 100V272M266 100h12M266 272h12" stroke="#2747d6" stroke-width="1.2"/><path d="M228 140l6-10 6 10" stroke="#ff4b2b" stroke-width="2" fill="none"/><text x="234" y="126" font-family="Kalam, 'Comic Sans MS', cursive" font-size="12" font-weight="700" font-style="normal" fill="#ff4b2b" text-anchor="middle">because</text><text x="400" y="128" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" font-size="30" font-weight="400" font-style="italic" fill="#16181d" text-anchor="start">One side.</text><text x="400" y="166" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" font-size="30" font-weight="400" font-style="italic" fill="#16181d" text-anchor="start">Well defended.</text><rect x="400" y="194" width="250" height="24" rx="12" fill="#2747d6"/><text x="525.0" y="210.5" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace" font-size="11.5" font-weight="600" font-style="normal" fill="#ffffff" text-anchor="middle">CAPS 300-350  ·  IEB 400-500</text><text x="400" y="72" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" font-size="20" font-weight="400" font-style="italic" fill="#16181d" text-anchor="start">The argumentative essay</text></svg>
